# ESIS v2 일반교육(중고등교육) API — OpenAPI 3.1
# 자동 생성: GET https://developerv2.esis.edu.mn/api/structure → gen_openapi.cjs → PyYAML
openapi: 3.1.0
info:
  title: ESIS v2 — 중고등교육(일반교육) API
  version: 2.0.0
  description: '몽골 교육부 ESIS v2 일반교육 시스템(Сургууль, цэцэрлэгийн систем) API 스펙.

    ## 규약

    - 모든 파라미터 값은 의미상 타입과 무관하게 **문자열(String)로 전송**하는 것이 ESIS 관례입니다. 스키마 type은 의미 표현용.

    - 응답은 공통 봉투 `{ SUCCESS_CODE, RESPONSE_MESSAGE, RESULT }` 사용. 실제 데이터는 보통 `RESULT` 배열.

    - 쓰기 서비스는 단일 엔드포인트에서 요청 본문의 `event`(CREATE/UPDATE/DELETE 등)로 동작 분기하는 경우가 많음.

    - 저장은 배열 배치 처리가 흔하며, 응답은 행 단위 결과(personId + status/message)를 돌려줄 수 있음.

    - 동일 path+method를 가진 서비스는 하나의 operation으로 통합(`x-esis-merged`). required는 분기 공통 항목만 표기.

    - 엔드포인트 경로 미공개로 제외된 서비스: Суралцагчийн шилжилт хөдөлгөөний мэдээлэл'
servers:
- url: https://hubv2.esis.edu.mn
  description: ESIS v2 hub
security:
- bearerAuth: []
tags:
- name: Багшийн мэдээлэл
- name: Байгууллагын мэдээлэл
- name: Бүлгийн ирц
- name: Бүлгийн мэдээлэл
- name: Вакцины мэдээлэл
- name: Дэвшилт
- name: Суралцагчийн мэдээлэл
- name: Суралцагчийн нэмэлт мэдээлэл
- name: Сүү хөтөлбөр
- name: Төгсөлт
- name: Төсөв хөрөнгө
- name: Хичээл
- name: Хичээлийн дүн
- name: Шалгалт
- name: Үнэлгээ 2
- name: 기타
paths:
  /svc/api/hub/v2/academic-year/info:
    get:
      operationId: API_000257
      summary: Хичээлийн жилийн хаалт, нээлтийн мэдээлэл лавлах
      tags:
      - Төгсөлт
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  SUCCESS_CODE:
                    type: integer
                    example: 200
                  RESPONSE_MESSAGE:
                    type: string
                  RESULT:
                    type: array
                    items:
                      type: object
                      properties:
                        institutionId:
                          type: number
                          description: Байгууллагын дугаар
                        academicYear:
                          type: string
                          description: Хичээлийн жил
                        currentAcademicYearFlag:
                          type: string
                          description: Идэвхтэй хичээлийн жил эсэх [Y/N] ( Нэг сургуулийн хувьд зөвхөн нэг л идэвхтэй хичээлийн жил байна)
              example:
                SUCCESS_CODE: 200
                RESPONSE_MESSAGE: Амжилттай
                RESULT:
                - institutionId: 30000
                  academicYear: '2026'
                  currentAcademicYearFlag: N
                - institutionId: 30000
                  academicYear: '2025'
                  currentAcademicYearFlag: Y
      parameters:
      - name: institutionId
        in: query
        required: true
        schema:
          type: number
        description: Байгууллагын дугаар
      x-esis-service: ESIS_HUB.PROC_SMS_ACADEMIC_YEAR_STATUS_GET
      x-esis-slug: API-000257
  /svc/api/hub/v2/academic-years/save:
    post:
      operationId: API_000256
      summary: Хичээлийн жилийн хаалт, нээлт хийх буюу хадгалах
      tags:
      - Төгсөлт
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                institutionId:
                  type: number
                  description: Байгууллагын дугаар
              required:
              - institutionId
            example:
              institutionId: 39971
      x-esis-service: ESIS_HUB.PROC_SMS_ACADEMIC_YEAR_MANAGE
      x-esis-slug: API-000256
