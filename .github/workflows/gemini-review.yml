name: '🔎 Gemini 3 Code Review'

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Google AI SDK
        # 최신 모델(Gemini 3) 인식을 위해 latest 버전을 설치합니다.
        run: pnpm add @google/generative-ai@latest -D -w

      - name: Run Gemini 3 Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'EOF'
          const { GoogleGenerativeAI } = require("@google/generative-ai");
          const { execSync } = require("child_process");

          async function run() {
            try {
              // 1. 이미지에서 확인된 최신 모델인 gemini-3-flash 사용
              const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
              const model = genAI.getGenerativeModel({ model: "gemini-3-flash" });

              // 2. PR 변경 사항(Diff) 추출
              const baseRef = "${{ github.base_ref }}";
              let diff;
              try {
                diff = execSync(`git diff origin/${baseRef}...HEAD`).toString();
              } catch (e) {
                console.error("Diff 추출 실패:", e);
                return;
              }

              if (!diff.trim()) {
                console.log("리뷰할 변경 사항이 없습니다.");
                return;
              }

              // 3. 리뷰 프롬프트 설정 (한국어)
              const prompt = `당신은 숙련된 시니어 개발자입니다. 
              아래의 Git Diff를 분석하여 코드 리뷰를 수행해 주세요.
              
              지침:
              - 잠재적인 버그, 성능 이슈, 가독성을 중심으로 체크하세요.
              - 개선이 필요한 부분은 코드 예시를 포함하여 친절하게 설명해 주세요.
              - 모든 답변은 한국어로 작성하세요.

              [Git Diff]
              ${diff.substring(0, 30000)}`;

              console.log("Gemini-3-Flash 모델로 리뷰 생성 중...");
              const result = await model.generateContent(prompt);
              const response = await result.response;
              const reviewText = response.text();

              // 4. GitHub PR에 댓글 작성
              const repo = "${{ github.repository }}";
              const prNum = "${{ github.event.pull_request.number }}";
              const url = `https://api.github.com/repos/${repo}/issues/${prNum}/comments`;
              
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  "Authorization": `token ${process.env.GITHUB_TOKEN}`,
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  body: `## 🤖 Gemini 3 AI 전문 코드 리뷰\n\n${reviewText}`
                })
              });

              if (res.ok) {
                console.log("리뷰 댓글 게시 완료!");
              } else {
                const error = await res.json();
                console.error("댓글 게시 실패:", error);
              }
            } catch (error) {
              console.error("실행 중 오류 발생:", error);
              process.exit(1);
            }
          }

          run();
          EOF