name: '🔎 Gemini Pro Code Review'

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -q -U google-generativeai requests

      - name: Run Gemini Pro Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import os
          import subprocess
          import google.generativeai as genai
          import requests

          genai.configure(api_key=os.environ["GEMINI_API_KEY"])
          
          # 1. Pro 모델 사용
          model = genai.GenerativeModel('gemini-1.5-pro')

          base_ref = "${{ github.base_ref }}"
          diff = subprocess.check_output(f"git diff origin/{base_ref}...HEAD", shell=True).decode('utf-8')

          if not diff:
              print("No changes found.")
              exit(0)

          # 2. 페르소나와 형식을 강조한 전문적인 프롬프트
          prompt = f"""
          당신은 세계적인 수준의 수석 소프트웨어 엔지니어입니다. 
          제공된 Git Diff를 분석하여 코드 리뷰를 수행하세요.

          [분석 지침]
          1. 버그, 보안 이슈, 성능 저하 요인을 우선적으로 찾으세요.
          2. 가독성, 유지보수성, 중복 코드를 체크하세요.
          3. 단순 지적이 아닌, '어떻게 수정하면 좋은지' 코드 예시를 포함해 제안하세요.

          [출력 형식]
          - 요약: 변경 사항 요약
          - 긍정적인 부분: 잘 작성된 점
          - 개선 제안: 이슈 항목별로 (이슈 내용 / 이유 / 권장 코드) 순서로 작성
          - 종합 점수: 5점 만점으로 평가

          [Git Diff]
          {diff}
          """
          
          response = model.generate_content(prompt)
          
          repo = "${{ github.repository }}"
          pr_num = "${{ github.event.pull_request.number }}"
          url = f"https://api.github.com/repos/{repo}/issues/{pr_num}/comments"
          headers = {"Authorization": f"token {os.environ['GITHUB_TOKEN']}"}
          
          # 깔끔한 템플릿으로 출력
          body = f"## 🚀 Gemini 코드 리뷰\n\n{response.text}"
          requests.post(url, json={"body": body}, headers=headers)
          EOF