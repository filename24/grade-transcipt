name: '🔎 Gemini Pro Code Review (Node.js)'

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @google/generative-ai

      - name: Run Gemini Pro Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'EOF'
          const { GoogleGenerativeAI } = require("@google/generative-ai");
          const { execSync } = require("child_process");

          async function run() {
            try {
              // 1. Gemini 설정
              const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
              const model = genAI.getGenerativeModel({ model: "gemini-3-flash" });

              // 2. PR Diff 추출
              const baseRef = "${{ github.base_ref }}";
              const diff = execSync(`git diff origin/${baseRef}...HEAD`).toString();

              if (!diff.trim()) {
                console.log("No changes found.");
                return;
              }

              // 3. 리뷰 프롬프트 작성
              const prompt = `당신은 시니어 개발자이자 코드 리뷰어입니다. 
              아래의 코드 변경 사항(Git Diff)을 분석하고 한국어로 정중하게 리뷰를 작성해 주세요.
              
              [분석 포인트]
              - 잠재적인 버그 및 런타임 에러 가능성
              - 성능 최적화 및 보안 취약점
              - 가독성과 유지보수성 개선 방안
              
              [Git Diff]
              ${diff.substring(0, 20000)}`;

              console.log("Gemini 1.5 Pro에게 리뷰 요청 중...");
              const result = await model.generateContent(prompt);
              const response = await result.response;
              const reviewText = response.text();

              // 4. GitHub PR에 댓글 작성
              const repo = "${{ github.repository }}";
              const prNum = "${{ github.event.pull_request.number }}";
              const url = `https://api.github.com/repos/${repo}/issues/${prNum}/comments`;
              
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  "Authorization": `token ${process.env.GITHUB_TOKEN}`,
                  "Accept": "application/vnd.github.v3+json",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  body: `## 🚀 Gemini AI 리뷰\n\n${reviewText}`
                })
              });

              if (res.ok) {
                console.log("리뷰 댓글이 성공적으로 게시되었습니다.");
              } else {
                const errorData = await res.json();
                console.error("댓글 게시 실패:", errorData);
              }
            } catch (error) {
              console.error("오류 발생:", error);
              process.exit(1);
            }
          }

          run();
          EOF